name: pipeline

# Part 6 Phase 40. Scope is deliberately split by what a GPU-less runner can actually prove:
# the logic gates run here and are blocking; the rendering and performance gates need a real
# Vulkan device and therefore run locally via Pipeline/run.sh, not in CI.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1

jobs:
  backend:
    name: 后端契约测试（账号 / 存档 / 账本 / UGC）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node backend/test.mjs

  logic:
    name: 解析 / 启动 / 功能自测 / 静态审查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 解析 Godot 下载地址（不硬编码 URL）
        id: url
        run: |
          J=$(curl -fsSL "https://api.github.com/repos/godotengine/godot/releases/tags/${GODOT_VERSION}-stable")
          U=$(printf '%s' "$J" | jq -r '.assets[] | select(.name | test("linux.*x86_64")) | .browser_download_url' | head -1)
          [ -n "$U" ] && [ "$U" != "null" ] || { echo "找不到 Linux 发行资产"; exit 1; }
          echo "url=$U" >> "$GITHUB_OUTPUT"
          echo "下载：$U"

      - name: 安装 Godot
        run: |
          sudo apt-get update && sudo apt-get install -y unzip
          curl -fsSL -o godot.zip "${{ steps.url.outputs.url }}"
          unzip -q godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot"/*
          echo "$HOME/godot" >> "$GITHUB_PATH"
          echo "GODOT=$HOME/godot/$(ls "$HOME/godot" | head -1)" >> "$GITHUB_ENV"

      - name: 导入工程并校验解析
        run: |
          "$GODOT" --headless --editor --quit --path . >parse.log 2>&1 || true
          grep -iE "parse error|script error|failed to load" parse.log && exit 1 || echo "parse: clean"

      - name: 无头启动零报错
        run: |
          "$GODOT" --headless --path . --quit-after 60 >boot.log 2>&1 || true
          if grep -qE "^ERROR|SCRIPT ERROR" boot.log; then grep -E "^ERROR|SCRIPT ERROR" boot.log | head; exit 1; fi
          echo "boot: 0 error"

      - name: 创造系统自测
        run: |
          "$GODOT" --headless --path . --quit-after 150 -- --create-test >create.log 2>&1 || true
          cat create.log | grep -E "PASS|FAIL|self-test"
          grep -q "creation self-test: PASS" create.log

      # The menu is headless-testable because it is driven through choose()/set_quality() rather
      # than through mouse events. Two of its assertions are about what the menu must NOT do:
      # it must not pause the tree, and the city must keep streaming behind it.
      - name: 主菜单自测（新游戏 / 画质切档 / 不暂停场景树）
        run: |
          timeout 600 "$GODOT" --headless --path . --quit-after 4000 -- --menu-test >menu.log 2>&1 || true
          grep -E "^PASS|^FAIL|self-test" menu.log
          # Two-digit check count mirrors MIN_MENU_ASSERTS=10 in Pipeline/gates.sh: dropping an
          # assertion must fail here rather than quietly lowering the bar.
          grep -qE "main menu self-test: PASS \([0-9]{2,} checks, 0 failures\)" menu.log

      # The city economy is CPU-only state, so its contract runs here rather than waiting for
      # a GPU runner. Frame caps are generous and `timeout` guards the case where streaming
      # never reaches the 250-chunk threshold the test waits on: silence fails, it does not hang.
      - name: 城市模拟自测（区级经济 + 消费端接入）
        run: |
          timeout 900 "$GODOT" --headless --path . --quit-after 20000 -- --sim-test >sim.log 2>&1 || true
          grep -E "^\[test\] FAIL|self-test" sim.log
          grep -q "city simulation self-test: PASS" sim.log

      - name: 城市模拟年度浸泡（守恒 + 反塌缩）
        run: |
          timeout 900 "$GODOT" --headless --path . --quit-after 20000 -- --sim-soak=8760 >soak.log 2>&1 || true
          grep -E "^\[soak\]|^\[test\] FAIL" soak.log
          grep -q "sim soak: PASS" soak.log

      - name: 客户端-后端存档往返
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          bash Pipeline/backend_sync.sh

      # The Node-side contract test shares its encoder with the server, so it cannot see a
      # cross-language seam break; this step boots the real GDScript client against the real
      # server and is the only thing that would have caught BUG-023.
      - name: 真实客户端-游戏服务器互通（多人接缝）
        run: bash Pipeline/mp_probe.sh

      - name: 世界普查
        run: |
          "$GODOT" --headless --path . --quit-after 60 -- --census 2>&1 | grep -E "^\[census\]|^\[pop\]"

      - name: 静态审查
        run: bash Pipeline/review.sh

      - name: 交接消息格式自检
        run: bash Pipeline/check_msg.sh AI_Agents/examples/handoff.json

  artifacts:
    name: 产物
    runs-on: ubuntu-22.04
    needs: logic
    steps:
      - uses: actions/checkout@v4
      - name: 打包源码
        run: |
          mkdir -p out
          git ls-files -z | xargs -0 tar -czf "out/source-${GITHUB_SHA::7}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: out/*.tar.gz
          retention-days: 14
